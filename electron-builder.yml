appId: com.lightcode.app
productName: Lightcode
copyright: Copyright (C) 2026 Lightcode

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
  - node_modules/node-pty/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/electron-updater/**/*
  - node_modules/.pnpm/electron-updater@*/node_modules/**/*
  # Claude SDK loads a platform-specific runtime package dynamically (e.g.
  # `@anthropic-ai/claude-agent-sdk-win32-x64`). Under pnpm those live in the
  # `.pnpm/` store and are not pulled in by the plain root package path alone.
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**/*
  - node_modules/.pnpm/@anthropic-ai+claude-agent-sdk-*/node_modules/@anthropic-ai/**/*
  - node_modules/.pnpm/builder-util-runtime@*/node_modules/**/*
  - node_modules/.pnpm/debug@*/node_modules/**/*
  - node_modules/.pnpm/ms@*/node_modules/**/*
  - node_modules/.pnpm/sax@*/node_modules/**/*
  - node_modules/.pnpm/fs-extra@*/node_modules/**/*
  - node_modules/.pnpm/graceful-fs@*/node_modules/**/*
  - node_modules/.pnpm/jsonfile@*/node_modules/**/*
  - node_modules/.pnpm/universalify@*/node_modules/**/*
  - node_modules/.pnpm/js-yaml@*/node_modules/**/*
  - node_modules/.pnpm/argparse@*/node_modules/**/*
  - node_modules/.pnpm/lazy-val@*/node_modules/**/*
  - node_modules/.pnpm/lodash.escaperegexp@*/node_modules/**/*
  - node_modules/.pnpm/lodash.isequal@*/node_modules/**/*
  - node_modules/.pnpm/semver@*/node_modules/**/*
  - node_modules/.pnpm/tiny-typed-emitter@*/node_modules/**/*
  # @sentry/electron pulls @sentry/node which eagerly requires @opentelemetry/*
  # and friends at import time. Those packages live deep under .pnpm/ and are
  # not traversed into the asar by electron-builder. `.npmrc` public-hoists
  # them to top-level node_modules so the default node_modules pattern picks
  # them up.
  - node_modules/@opentelemetry/**/*
  - node_modules/@sentry-internal/**/*
  - node_modules/@fastify/otel/**/*
  - node_modules/@prisma/instrumentation/**/*
  - node_modules/import-in-the-middle/**/*
  - node_modules/require-in-the-middle/**/*
  - node_modules/acorn/**/*
  - node_modules/acorn-import-attributes/**/*
  - node_modules/cjs-module-lexer/**/*
  - node_modules/module-details-from-path/**/*
  # Renderer-only packages — Vite already bundles them into dist/renderer/.
  # Excluding the source copies trims ~10k entries from the asar.
  - "!node_modules/monaco-editor/**/*"
  - "!node_modules/@monaco-editor/**/*"
  - "!node_modules/lucide-react/**/*"
  - "!node_modules/material-icon-theme/**/*"
  - "!node_modules/shiki/**/*"
  - "!node_modules/@shikijs/**/*"
  - "!node_modules/react/**/*"
  - "!node_modules/react-dom/**/*"
  - "!node_modules/react-markdown/**/*"
  - "!node_modules/remark-gfm/**/*"
  - "!node_modules/rehype-raw/**/*"
  - "!node_modules/@heroui/**/*"
  - "!node_modules/@xterm/**/*"
  - "!node_modules/@git-diff-view/**/*"
  - "!node_modules/@dnd-kit/**/*"
  - "!node_modules/@tanstack/**/*"
  - "!node_modules/@chenglou/**/*"
  - "!node_modules/tailwindcss/**/*"
  - "!node_modules/@tailwindcss/**/*"
  # And the pnpm-store mirrors of those packages.
  - "!node_modules/.pnpm/monaco-editor@*/**/*"
  - "!node_modules/.pnpm/@monaco-editor*/**/*"
  - "!node_modules/.pnpm/lucide-react@*/**/*"
  - "!node_modules/.pnpm/material-icon-theme@*/**/*"
  - "!node_modules/.pnpm/shiki@*/**/*"
  - "!node_modules/.pnpm/@shikijs*/**/*"
  - "!node_modules/.pnpm/react@*/**/*"
  - "!node_modules/.pnpm/react-dom@*/**/*"
  - "!node_modules/.pnpm/react-markdown@*/**/*"
  - "!node_modules/.pnpm/remark-gfm@*/**/*"
  - "!node_modules/.pnpm/rehype-raw@*/**/*"
  - "!node_modules/.pnpm/@heroui*/**/*"
  - "!node_modules/.pnpm/@xterm*/**/*"
  - "!node_modules/.pnpm/@git-diff-view*/**/*"
  - "!node_modules/.pnpm/@dnd-kit*/**/*"
  - "!node_modules/.pnpm/@tanstack*/**/*"
  - "!node_modules/.pnpm/@chenglou*/**/*"
  - "!node_modules/.pnpm/tailwindcss@*/**/*"
  - "!node_modules/.pnpm/@tailwindcss*/**/*"

extraResources:
  - from: resources/wsl-helpers
    to: wsl-helpers
    filter:
      - "**/*"
  - from: resources/agent-plugins
    to: agent-plugins
    filter:
      - "**/*"

extraMetadata:
  main: dist/main/main.cjs

asar: true
asarUnpack:
  - node_modules/node-pty/**/*
  - node_modules/better-sqlite3/**/*
  # Claude SDK slash-command probe runs inside WSL via in-distro `node`, which
  # cannot read inside an asar archive. The worker resolves
  # `@anthropic-ai/claude-agent-sdk` from its own location, and the SDK loads a
  # platform runtime package dynamically, so unpack both roots and the pnpm
  # store entries that back the platform package.
  - dist/main/claudeSdkProbeWorker.mjs
  - node_modules/@anthropic-ai/claude-agent-sdk/**/*
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**/*
  - node_modules/.pnpm/@anthropic-ai+claude-agent-sdk-*/node_modules/@anthropic-ai/**/*

publish:
  provider: github
  owner: SDSLeon
  repo: lightcode

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Skip the combined multi-arch installer; emit only per-arch builds.
  buildUniversalInstaller: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  category: Development
  maintainer: SDSLeon <SDSLeon999@gmail.com>
  artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    # electron-updater requires a zipped app bundle for in-place macOS updates;
    # the DMG is install-only. Without zip, clients fail with "ZIP file not provided".
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}

npmRebuild: true
