name: Deploy PWA

# Deploys the hosted PWA (poracode-pwa on Vercel) whenever PWA-relevant source
# lands on master, plus on demand. This is the lightweight web-only pipeline;
# native store builds stay in release-mobile.yml.
#
# Requires in the `mobile-web` environment:
#   vars:    VERCEL_ORG_ID, VERCEL_PROJECT_ID, PORACODE_MOBILE_APP_HOST
#   secrets: VERCEL_TOKEN (plus optional PORACODE_MOBILE_APPLE_TEAM_ID /
#            PORACODE_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS for the
#            .well-known association files)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/mobile/**"
      - "src/renderer/**"
      - "src/shared/**"
      - "src/main/**"
      - "src/supervisor/**"
      - "resources/mobile-ssh-runtime/**"
      - "scripts/finalize-mobile-build.mjs"
      - "scripts/build-mobile-ssh-runtime.mjs"
      - "vercel.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pwa.yml"

permissions:
  contents: read

concurrency:
  group: deploy-pwa
  cancel-in-progress: true

jobs:
  web:
    name: Web (Vercel)
    runs-on: ubuntu-latest
    environment: mobile-web
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PORACODE_MOBILE_APP_HOST: ${{ vars.PORACODE_MOBILE_APP_HOST }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Validate Vercel configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing mobile-web variable: $name" >&2
              exit 1
            fi
          done
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing mobile-web secret: VERCEL_TOKEN" >&2
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@54.21.1
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        env:
          PORACODE_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ secrets.PORACODE_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS }}
          PORACODE_MOBILE_APPLE_TEAM_ID: ${{ secrets.PORACODE_MOBILE_APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
